const R={home,request,find,receivers,dash,help};
const render=()=>{const r=R[location.hash.slice(1)]?location.hash.slice(1):"home";$("#v").innerHTML=R[r]();const n=NAV.map(([k,l,i])=>`<a href="#${k}" class="${k==r?"on":""}" ${k==r?'aria-current="page"':""}>${ic(IC[i])}<span>${l}</span></a>`).join("");$("#tn").innerHTML=n;$("#bn").innerHTML=n;const c=$("#ch");if(c)c.scrollTop=c.scrollHeight};
const A={pc:d=>{F.city=d.n;render()},zoom:d=>{F.zl=Math.max(0,Math.min(2,(F.zl||0)+(+d.dir)));render()},hzoom:d=>{F.hz=Math.max(0,Math.min(2,(F.hz||0)+(+d.dir)));render()},ph:d=>{F.hs=d.n;render()},tg:(d,t)=>{F[d.k]=t.checked?1:0;render()},hq:(d,t)=>{F.hq=t.value;render()},more:()=>{F.n=(F.n||8)+8;render()},morer:()=>{F.rn=(F.rn||10)+10;render()},offer:d=>{if(S.me?.role!="donor")return toast("Sign in or preview as a donor to offer help");const x=S.donors.find(z=>z.id==S.me.did)||S.donors[0];S.inv.push({d:x.id,rid:d.id,st:"Offered",at:Date.now()});note(`You offered to help with ${d.id}. The hospital confirms eligibility.`);save();toast("Offer recorded. No donation is recorded until the hospital confirms.")},hc:(d,t)=>{const f=t.closest("form"),s=f.querySelector("[name=hosp]");s.innerHTML=hopts(t.value);A.ho(0,s)},ho:(d,t)=>{const f=t.closest("form"),o=f.querySelector("[name=hother]"),a=f.querySelector("[name=addr]"),x=t.selectedOptions[0];o.hidden=t.value!="__other";if(a)a.value=x&&x.dataset.ad?x.dataset.ad+", "+f.querySelector("[name=city]").value:""},hl:(d,t)=>{F.hc=t.value;render()},rl:(d,t)=>{const f=t.closest("form");f.querySelectorAll(".dn").forEach(e=>e.hidden=t.value!="donor");f.querySelectorAll(".hs").forEach(e=>e.hidden=t.value=="requester")},loc:()=>{if(!navigator.geolocation)return toast("Location isn’t available here. Pick a city instead.");navigator.geolocation.getCurrentPosition(p=>{F.pos=[+p.coords.latitude.toFixed(2),+p.coords.longitude.toFixed(2)];F.city=Object.entries(CITY).sort((a,b)=>km(F.pos,a[1])-km(F.pos,b[1]))[0][0];render();toast("Showing donors near "+F.city)},()=>toast("Location not shared. Pick a city instead."),{timeout:8000})},cx:()=>$("#dg").close(),ok:()=>{$("#dg").close();ask.f&&ask.f()},how:()=>$("#how").scrollIntoView({behavior:"smooth"}),join:()=>{mode="up";location.hash="dash";render()},grp:d=>{F.g=d.g;location.hash="find"},again:()=>{done=null;render()},mode:()=>{mode=mode=="in"?"up":"in";render()},out:()=>{S.me=null;save();render()},csv:()=>{csv=1;render()},
demo:d=>{S.me={name:"Demo "+d.r,role:d.r,demo:1,did:S.donors[0].id,email:"demo"};S.inv.some(i=>i.d==S.donors[0].id)||S.inv.push({d:S.donors[0].id,rid:"BL-DEMO01",st:"Invited",at:Date.now()});render()},
fl:(d,t)=>{F[d.k]=t.value;render()},wt:(d,t)=>{F.w[d.k]=+t.value;render()},av:(d,t)=>{S.donors.find(x=>x.id==d.id).av=t.value;save();toast("Availability updated")},
st:(d,t)=>{S.reqs.find(x=>x.id==d.id).st=t.value;note(`Request ${d.id} is now “${t.value}”`);log(`Set ${d.id} to ${t.value}`);save();toast("Status updated")},
acc:d=>{S.inv[d.i].st="Accepted";note("You accepted an invitation. The hospital will coordinate; no donation is recorded yet.");save();render();toast("Accepted: awaiting hospital coordination")},dec:d=>{S.inv[d.i].st="Declined";save();render();toast("Request declined")},
inv:d=>{S.inv.push({d:d.id,rid:S.reqs[0]?.id||"—",st:"Invited",at:Date.now()});note(`Invitation sent to donor ${d.id}`);save();toast("In-app invitation sent. No email or SMS provider is connected.")},
cancel:d=>ask(`Cancel request ${d.id}?`,()=>{S.reqs.find(x=>x.id==d.id).st="Cancelled";note(`Request ${d.id} cancelled`);log("Cancelled "+d.id);save();render();toast("Request cancelled")}),
sus:d=>ask("Change this account’s status?",()=>{const u=S.users.find(x=>x.email==d.e);u.sus=!u.sus;log((u.sus?"Suspended ":"Restored ")+u.email);save();render();toast("Account updated")}),
trk:()=>{const r=S.reqs.find(x=>x.id==$("#tid").value.trim().toUpperCase());$("#tres").innerHTML=r?`${r.id}: ${pill(r.st)}`:"No request with that ID."},
chk:()=>{const f=new FormData($("#rf")),v=Object.fromEntries(f),m=[],t=[];["pn","h","addr","cp","ph","dt"].forEach(k=>v[k].trim()||m.push(k));if(v.lvl=="Critical"&&!v.x.trim())t.push("add clinical context for a critical request");if(v.comp=="Platelets"&&+v.q>6)t.push("check platelet quantity with the hospital");if(v.dt&&new Date(v.dt)<new Date())t.push("the required time is in the past");$("#hint").textContent=m.length||t.length?`Missing or worth checking: ${[...m.map(k=>k+" is empty"),...t].join("; ")}.`:"Looks complete. The hospital still verifies everything."},
req:(v,f)=>{v.h=v.hosp=="__other"?(v.hother||"").trim():v.hosp;if(!v.h)return toast("Choose a hospital or enter its name");if(!/^[+\d][\d\s-]{7,14}$/.test(v.ph.trim()))return toast("Enter a valid contact number");if(+v.q<1||+v.q>10)return toast("Quantity must be 1–10 units");if(new Date(v.dt)<new Date(Date.now()-36e5))return toast("Required time is in the past");
const dup=S.reqs.find(r=>!["Fulfilled","Cancelled"].includes(r.st)&&r.g==v.g&&r.city==v.city&&r.h.toLowerCase()==v.h.trim().toLowerCase()&&Math.abs(new Date(r.dt)-new Date(v.dt))<216e5);
const go=()=>{addH(v.city,v.h);const id="BL-"+Math.random().toString(36).slice(2,8).toUpperCase(),n=rank(v.g,v.city,v.comp,F.w).length;S.reqs.unshift({...v,id,pn:v.pn.trim(),h:v.h.trim(),q:+v.q,st:n?"Potential Donors Found":"Searching for Donors",by:S.me?.email||"guest",at:Date.now(),n});Object.assign(F,{g:v.g,city:v.city,comp:v.comp});note(`Request ${id} submitted. ${n} potential donor(s) found by group match, not medical clearance.`);log("Created "+id);save();done=id;render();toast("Request submitted")};
dup?ask(`A similar open request (${dup.id}) already exists for this hospital, group and time. Submit anyway?`,go):go()},
auth:async v=>{const email=v.email.trim().toLowerCase();if(v.password.length<8)return toast("Password needs 8+ characters");const h=await hash(v.password);let u=S.users.find(x=>x.email==email);
if(mode=="in"){if(!u||u.h!=h)return toast("Incorrect email or password");if(u.sus)return toast("This account is suspended")}else{if(u)return toast("Email already registered. Sign in instead.");if(!v.name.trim())return toast("Enter your name");const hn=v.role=="requester"?"":v.hosp=="__other"?(v.hother||"").trim():v.hosp;if(v.role!="requester"&&!hn)return toast("Choose your hospital or enter its name");u={email,h,name:v.name.trim(),role:v.role,city:v.city,hosp:hn};if(hn)addH(v.city,hn);if(u.role=="donor"){u.did="D-"+Math.random().toString(16).slice(2,5).toUpperCase();S.donors.push({id:u.did,g:v.g,city:v.city,lat:CITY[v.city][0],lon:CITY[v.city][1],av:"Available",ver:0,last:365,hosp:hn});S.inv.push({d:u.did,rid:"BL-DEMO01",st:"Invited",at:Date.now()})}S.users.push(u);log("Registered "+u.role)}
S.me=u;save();render();toast("Welcome, "+u.name)},
